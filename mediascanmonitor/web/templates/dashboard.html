{% extends "base.html" %}
{% block title %}Dashboard — media-scan-monitor{% endblock %}
{% block content %}
{% include "_nav.html" %}
<h1>Dashboard</h1>

<div id="dashboard-status">
  {% include "_dashboard_status.html" %}
</div>

<section class="card wire-card">
  <h2>Signal <span class="live">live</span></h2>
  <ul id="event-feed" class="wire"></ul>
</section>
<script>
  // Mirror of the Events page feed: stream dispatch results onto the dashboard wire so the
  // landing screen shows the pipeline is alive. Newest at top; the wire keeps the last 50.
  (function () {
    const feed = document.getElementById("event-feed");
    const source = new EventSource("/events/stream");
    source.onmessage = function (e) {
      const r = JSON.parse(e.data);
      const li = document.createElement("li");
      li.className = "event event-" + (r.ok ? "ok" : "fail");
      // r.ts is a UTC ISO timestamp; render it in the viewer's local timezone.
      li.textContent = new Date(r.ts).toLocaleString() + "  [" + r.server_name + "] " + r.event_type + " " + r.file_path +
        "  -> " + (r.ok ? "ok" : "FAIL") + (r.detail ? " (" + r.detail + ")" : "");
      feed.insertBefore(li, feed.firstChild);
      while (feed.children.length > 50) { feed.removeChild(feed.lastChild); }
    };
  })();
</script>
{% endblock %}
